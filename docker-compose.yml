services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: vendnet
      MYSQL_USER: vendnet_user
      MYSQL_PASSWORD: vendnet_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vendnet

  vendnet:
    build:
      context: ./vendnet
      dockerfile: Dockerfile
    container_name: vendnet-app
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: bootstrap
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/vendnet
      SPRING_DATASOURCE_USERNAME: vendnet_user
      SPRING_DATASOURCE_PASSWORD: vendnet_pass
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      APP_LOGGING_PATH: /var/vendnet/logs
      APP_STORAGE_BASE_PATH: /var/vendnet
      APP_TELEMETRY_ALLOW_HEADER_CN: "true"
      APP_PAYMENT_WEBHOOK_SECRET: e2e-webhook-secret
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus,metrics
      MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED: "true"
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://otel-collector:4318/v1/traces
      MANAGEMENT_OTLP_TRACING_TRANSPORT: http
      LOGGING_LEVEL_PT_ISEP_DESOFS_VENDNET: INFO
    volumes:
      - vendnet_logs:/var/vendnet/logs
    depends_on:
      mysql:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - vendnet

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    depends_on:
      vendnet:
        condition: service_healthy
    networks:
      - vendnet

  loki:
    image: grafana/loki:3.2.2
    ports:
      - "3100:3100"
    volumes:
      - ./docker/loki/loki-config.yml:/etc/loki/loki-config.yml
      - loki_data:/loki
    command: -config.file=/etc/loki/loki-config.yml
    networks:
      - vendnet

  promtail:
    image: grafana/promtail:3.2.2
    volumes:
      - ./docker/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml
      - vendnet_logs:/var/log/vendnet:ro
    command: -config.file=/etc/promtail/promtail-config.yml
    networks:
      - vendnet
    depends_on:
      - loki

  jaeger:
    image: jaegertracing/all-in-one:1.65.0
    ports:
      - "16686:16686"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - COLLECTOR_OTLP_HTTP_PORT=4318
      - COLLECTOR_OTLP_GRPC_PORT=4317
    networks:
      - vendnet

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    command: ["--config=/etc/otelcol-contrib/otel-collector-config.yml"]
    volumes:
      - ./docker/otel/otel-collector-config.yml:/etc/otelcol-contrib/otel-collector-config.yml:ro
    ports:
      - "4317:4317"
      - "8889:8889"
    depends_on:
      - jaeger
    networks:
      - vendnet

  grafana:
    image: grafana/grafana:11.3.1
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - vendnet
    depends_on:
      - prometheus
      - loki
      - jaeger

volumes:
  mysql_data:
  prometheus_data:
  grafana_data:
  loki_data:
  vendnet_logs:

networks:
  vendnet:
    driver: bridge
