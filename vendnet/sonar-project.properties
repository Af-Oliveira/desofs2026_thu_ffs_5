sonar.projectKey=vendnet
sonar.projectName=VendNet - Vending Machine Network
sonar.projectVersion=0.0.1

sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.junit.reportPaths=target/surefire-reports

sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Exclude packages from coverage that JaCoCo doesn't enforce thresholds on
# (mirrors ci-security profile: only domain.* + application.* are gated)
sonar.coverage.exclusions=api/**,config/**,infrastructure/**,**/VendnetApplication.java, domain/exception/**
