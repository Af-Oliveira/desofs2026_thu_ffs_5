# VendNet — ZAP DAST Profile (H2 in-memory, self-contained)
spring.datasource.url=jdbc:h2:mem:vendnet_zap;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

app.jwt.secret=zap_test_secret_key_min_32_characters_long
app.jwt.expiration-ms=86400000

app.storage.base-path=/tmp/vendnet-zap
app.payment.webhook-secret=zap-webhook-secret
app.logging.path=/tmp/vendnet-zap/logs

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
spring.jackson.deserialization.fail-on-unknown-properties=true

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always

logging.level.pt.isep.desofs.vendnet=INFO
logging.level.org.springframework.security=WARN
