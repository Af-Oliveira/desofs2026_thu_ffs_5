spring.application.name=vendnet-ci

spring.datasource.url=jdbc:mysql://localhost:3306/vendnet
spring.datasource.username=vendnet_user
spring.datasource.password=vendnet_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.jwt.secret=ci_test_secret_key_min_32_characters_long
app.jwt.expiration-ms=86400000

app.storage.base-path=/tmp/vendnet-ci
app.payment.webhook-secret=ci-webhook-secret-placeholder
app.logging.path=/tmp/vendnet-ci/logs

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always

spring.jackson.deserialization.fail-on-unknown-properties=true

logging.level.pt.isep.desofs.vendnet=INFO
logging.level.org.springframework.security=INFO
