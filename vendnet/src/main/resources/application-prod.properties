# =============================================================================
# PROD Profile — Hardened, real users, secrets via environment variables
# =============================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

app.storage.base-path=/var/vendnet
app.payment.webhook-secret=${PAYMENT_HMAC_SECRET}
app.audit-log.hmac-secret=${AUDIT_LOG_HMAC_SECRET}
app.logging.path=/var/vendnet/logs

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.metrics.export.prometheus.enabled=false

logging.level.pt.isep.desofs.vendnet=WARN
logging.level.org.springframework.security=WARN
logging.level.root=WARN

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=5MB
