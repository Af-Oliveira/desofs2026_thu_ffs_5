spring.application.name=vendnet

spring.datasource.url=jdbc:mysql://localhost:3306/vendnet
spring.datasource.username=vendnet_user
spring.datasource.password=vendnet_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

app.jwt.secret=MUDA_ISTO_PARA_SEGREDO_FORTE_256BITS
app.jwt.expiration-ms=86400000

app.storage.base-path=/var/vendnet
app.payment.webhook-secret=webhook-secret-placeholder
app.logging.path=/var/vendnet/logs

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=alpha

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=http://localhost:4318/v1/traces
management.otlp.tracing.transport=http

logging.level.pt.isep.desofs.vendnet=DEBUG

spring.jackson.default-property-inclusion=non_null
spring.jackson.deserialization.fail-on-unknown-properties=true
