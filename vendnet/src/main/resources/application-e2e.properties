# =============================================================================
# VendNet — E2E Profile (H2 in-memory, self-contained)
# =============================================================================
# Overrides MySQL with H2 so "make e2e" works without Docker.
# Bootstrap profile seeds test data. Dev profile enables debug logging.
# Usage: make e2e   (handles start/stop automatically)
# =============================================================================

spring.datasource.url=jdbc:h2:mem:vendnet_e2e;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

app.logging.path=./logs
app.storage.base-path=./data

app.jwt.secret=e2e_secret_key_for_end_to_end_testing_at_least_256_bits
app.jwt.expiration-ms=86400000
app.payment.webhook-secret=e2e-webhook-secret

logging.level.pt.isep.desofs.vendnet=INFO
logging.level.org.springframework.security=WARN
