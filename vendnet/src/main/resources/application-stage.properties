# =============================================================================
# STAGE Profile — Production-like, MySQL, QA/UAT, integration tests
# =============================================================================
spring.datasource.url=jdbc:mysql://localhost:3307/vendnet_stage
spring.datasource.username=vendnet_user
spring.datasource.password=stage_vendnet_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

app.jwt.secret=${JWT_SECRET:stage-jwt-secret-for-staging-environment}
app.jwt.expiration-ms=86400000

app.storage.base-path=/var/vendnet
app.payment.webhook-secret=${PAYMENT_HMAC_SECRET:stage-webhook-secret}
app.audit-log.hmac-secret=${AUDIT_LOG_HMAC_SECRET:}
app.logging.path=/var/vendnet/logs

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized
management.metrics.export.prometheus.enabled=true

logging.level.pt.isep.desofs.vendnet=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
