# =============================================================================
# VendNet CI/CD Pipeline — Full Security Pipeline
#
# Flow per Doc/Sugestions.md & CI_CD_USER_STORIES.md:
#   Secret Detect ──┐
#   Semgrep ────────┤
#                    ├──> [Build, Test & Package] ──> [SAST] ──> [DAST ZAP] ──> [Deploy]
#   SCA / Enforcer ─┘                                  ├──> [SonarQube]
#                                                      ├──> [IAST]
#                                                      └──> [Docker Build & Trivy] ──> [Deploy]
#
# Key fixes vs previous version:
#   - ZAP DAST: removed chmod -R a+w that failed on root-owned Docker files
#   - ZAP DAST: added MFA-aware token acquisition (handles mfaRequired=true)
#   - SonarQube: uses secrets instead of hardcoded creds, reuses build artifacts
#   - Build: generates CycloneDX SBOM, JaCoCo coverage gate (≥80%)
#   - Trivy: pinned to specific version (not @master)
#   - Deploy: actual SSH-based deployment to vs427 per GITHUB_ENVIRONMENTS_SETUP.md
#   - Concurrency: cancel-in-progress prevents duplicate runs on same branch
#   - Dependabot: required by US-SCA-002 (configured in .github/dependabot.yml)
# =============================================================================

name: CI / CD Pipeline — VendNet

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: write
  pull-requests: read
  issues: write

jobs:
  # ===========================================================================
  # STAGE 0a — Secret Detection (source-only, runs immediately)
  # ===========================================================================
  secret-detect:
    name: Secret Detection - Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================================================
  # STAGE 0b — Semgrep (source-only, runs in parallel)
  # ===========================================================================
  semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep Scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/java p/secrets
      - name: Check Semgrep SARIF
        id: sarif
        run: |
          if [ -f semgrep.sarif ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; fi
      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: steps.sarif.outputs.exists == 'true'
        with:
          sarif_file: semgrep.sarif

  # ===========================================================================
  # STAGE 1 — Build, Test & Package (unit + ArchUnit + integration + SBOM + coverage gate)
  # ===========================================================================
  build:
    name: Build, Test & Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Full Build & Test (unit + ArchUnit + integration)
        run: ./mvnw -B verify -P integration-test -Dspring.profiles.active=test
        working-directory: vendnet

      - name: JaCoCo Coverage Gate (≥80% domain + application)
        run: ./mvnw -B verify -P ci-security -Dspring.profiles.active=test -DskipTests
        working-directory: vendnet

      - name: Generate CycloneDX SBOM
        run: ./mvnw -B cyclonedx:makeAggregateBom -DskipTests
        working-directory: vendnet

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: vendnet/target/site/jacoco/

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            vendnet/target/surefire-reports/
            vendnet/target/failsafe-reports/

      - name: Upload Build Output (for SonarQube reuse)
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            vendnet/target/classes/
            vendnet/target/site/
            vendnet/target/*.jar
          retention-days: 1

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: vendnet/target/vendnet-sbom.json

  # ===========================================================================
  # STAGE 2a — SAST: SpotBugs (needs compiled classes)
  # ===========================================================================
  sast:
    name: SAST - SpotBugs + FindSecBugs
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: SpotBugs with FindSecBugs
        run: ./mvnw -B spotbugs:check -Dspotbugs.effort=Max -Dspotbugs.threshold=Low
        working-directory: vendnet
      - name: Upload SpotBugs Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spotbugs-report
          path: vendnet/target/spotbugsXml.xml

  # ===========================================================================
  # STAGE 2b — SCA: Dependency Check + Maven Enforcer
  # ===========================================================================
  sca:
    name: SCA - Dependency Check + Maven Enforcer
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Cache NVD Database
        uses: actions/cache@v4
        with:
          path: ~/.dependency-check/data
          key: nvd-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: nvd-cache-${{ runner.os }}-
      - name: Maven Enforcer (pinned versions)
        run: ./mvnw -B validate
        working-directory: vendnet
      - name: OWASP Dependency Check
        run: ./mvnw -B org.owasp:dependency-check-maven:check -Danalyzer.ossindex.enabled=false
        working-directory: vendnet
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      - name: Upload Dependency Check Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: vendnet/target/dependency-check-report.html

  # ===========================================================================
  # STAGE 2c — IAST: Runtime Taint Analysis Build Gate
  # ===========================================================================
  iast:
    name: IAST - Runtime Taint Analysis
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: IAST Taint-Tracking Build Gate
        run: ./mvnw -B verify -P iast -Dspring.profiles.active=test
        working-directory: vendnet
      - name: Upload IAST Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iast-report
          path: vendnet/target/failsafe-reports/

  # ===========================================================================
  # STAGE 3 — SonarQube Quality Gate (reuses build output, no recompilation)
  # ===========================================================================
  sonar:
    name: SonarQube - Quality Gate
    runs-on: ubuntu-latest
    needs: [build, sast, sca]
    steps:
      - name: Check SonarQube secrets
        id: check_secrets
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_HOST_URL" ] && [ -n "$SONAR_TOKEN" ]; then
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::SONAR_HOST_URL or SONAR_TOKEN not configured — skipping SonarQube"
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check_secrets.outputs.has_secrets == 'true'
        with: { fetch-depth: 0 }

      - uses: actions/setup-java@v4
        if: steps.check_secrets.outputs.has_secrets == 'true'
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Download Build Output
        if: steps.check_secrets.outputs.has_secrets == 'true'
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: vendnet/target/

      - name: Import vs-gate SSL certificate
        if: steps.check_secrets.outputs.has_secrets == 'true'
        run: |
          cp "${JAVA_HOME}/lib/security/cacerts" /tmp/cacerts
          chmod u+w /tmp/cacerts
          echo | openssl s_client -connect vs-gate.dei.isep.ipp.pt:10427 -servername vs-gate.dei.isep.ipp.pt 2>/dev/null | openssl x509 -out /tmp/vsgate.crt
          "${JAVA_HOME}/bin/keytool" -importcert -keystore /tmp/cacerts -storepass changeit -file /tmp/vsgate.crt -noprompt

      - name: SonarQube Analysis + Quality Gate
        if: steps.check_secrets.outputs.has_secrets == 'true'
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw -B sonar:sonar \
            -Dsonar.projectDate="$(date -u +%Y-%m-%dT%H:%M:%S%z)" \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300 \
            -Djavax.net.ssl.trustStore=/tmp/cacerts \
            -Djavax.net.ssl.trustStorePassword=changeit
        working-directory: vendnet

  # ===========================================================================
  # STAGE 4 — Docker Build & Trivy Scan (main/develop only)
  # ===========================================================================
  docker-build:
    name: Docker Build & Trivy Scan
    runs-on: ubuntu-latest
    needs: [build, sast, sca]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4

      - name: Extract metadata
        id: meta
        run: |
          echo "branch=${GITHUB_REF#refs/heads/}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF#refs/heads/}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build Docker Image
        run: |
          docker build -t vendnet:${{ steps.meta.outputs.tag }} vendnet/
          docker tag vendnet:${{ steps.meta.outputs.tag }} vendnet:${{ steps.meta.outputs.branch }}-latest

      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'vendnet:${{ steps.meta.outputs.tag }}'
          scan-type: 'image'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          format: 'sarif'
          output: 'trivy-image-results.sarif'

      - name: Upload Trivy Results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-image-results.sarif

      - name: Save Docker Image
        run: docker save vendnet:${{ steps.meta.outputs.tag }} vendnet:${{ steps.meta.outputs.branch }}-latest | gzip > /tmp/vendnet-image.tar.gz

      - name: Upload Docker Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ steps.meta.outputs.branch }}
          path: /tmp/vendnet-image.tar.gz
          retention-days: 1

  # ===========================================================================
  # STAGE 5 — DAST: OWASP ZAP (needs running app)
  #
  # ZAP runs as user 'zap' (uid 1000) inside the container but .zap/reports
  # is created by the runner user.  We chmod a+w *before* each scan so the
  # container can write report files; a post-scan sudo chmod ensures
  # root-owned artefacts are readable for upload.
  # ===========================================================================
  dast:
    name: DAST - OWASP ZAP Baseline + Authenticated
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Start Spring Boot (H2 + bootstrap)
        run: |
          ./mvnw -B package -DskipTests -q
          java -Dspring.profiles.active=zap,bootstrap -jar target/*.jar > /tmp/vendnet-dast.log 2>&1 &
        working-directory: vendnet

      - name: Wait for App Health
        run: |
          for i in $(seq 1 60); do
            if curl -s http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "App healthy after $((i * 2))s"
              sleep 3
              exit 0
            fi
            sleep 2
          done
          echo "App failed to start after 120s"
          cat /tmp/vendnet-dast.log 2>/dev/null || true
          exit 1

      - name: Obtain JWTs for all RBAC roles
        id: login
        run: |
          mkdir -p .zap/tokens
          for creds in "admin@vendnet.io:Admin@1234" "operator@vendnet.io:Operator@1234" "customer@vendnet.io:Customer@1234"; do
            EMAIL="${creds%%:*}"
            PASS="${creds##*:}"
            ROLE=$(echo "$EMAIL" | cut -d@ -f1)
            TOKEN=""
            for attempt in 1 2 3; do
              HTTP_CODE=$(curl -s -o /tmp/login-resp.json -w "%{http_code}" -X POST http://localhost:8080/api/auth/login \
                -H "Content-Type: application/json" \
                -d "{\"email\":\"${EMAIL}\",\"password\":\"${PASS}\"}")
              echo "Login ${EMAIL} attempt ${attempt}: HTTP ${HTTP_CODE}"
              BODY=$(cat /tmp/login-resp.json)
              if [ "$HTTP_CODE" = "200" ]; then
                TOKEN=$(echo "$BODY" | python3 -c "import sys,json; print(json.load(sys.stdin).get('token',''))" 2>/dev/null)
                if [ -n "$TOKEN" ] && [ "$TOKEN" != "None" ] && [ "$TOKEN" != "null" ] && [ "$TOKEN" != "" ]; then
                  echo "${TOKEN}" > ".zap/tokens/${ROLE}.jwt"
                  echo "Logged in as ${EMAIL} (${ROLE})"
                  break
                fi
              else
                echo "  Response: ${BODY}"
              fi
              sleep 2
            done
            if [ -z "$TOKEN" ] || [ "$TOKEN" = "None" ] || [ "$TOKEN" = "null" ]; then
              MFA=$(cat /tmp/login-resp.json | python3 -c "import sys,json; print(json.load(sys.stdin).get('mfaRequired',''))" 2>/dev/null || echo "")
              if [ "$MFA" = "True" ] || [ "$MFA" = "true" ]; then
                echo "::warning::MFA required for ${EMAIL} — skipping (bootstrap users should not have MFA)"
              else
                echo "::warning::Login failed for ${EMAIL} after 3 attempts"
              fi
            fi
          done
          TOKEN_COUNT=$(find .zap/tokens -name '*.jwt' | wc -l)
          echo "tokens_obtained=${TOKEN_COUNT}" >> "$GITHUB_OUTPUT"
          echo "Obtained ${TOKEN_COUNT} of 3 required tokens"
          if [ "$TOKEN_COUNT" -eq 0 ]; then
            echo "::warning::No JWT tokens obtained — running baseline scan only"
            echo "=== Boot log (last 60 lines) ==="
            tail -60 /tmp/vendnet-dast.log 2>/dev/null || true
          fi
          ls -la .zap/tokens/

      - name: ZAP Baseline Scan - Public Surface
        run: |
          mkdir -p .zap/reports
          chmod a+w .zap/reports
          docker run --rm --network host \
            -v ${{ github.workspace }}/.zap:/zap/wrk \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://localhost:8080 \
            -c rules.tsv \
            -r /zap/wrk/reports/zap-baseline.html \
            -w /zap/wrk/reports/zap-baseline.md \
            -x /zap/wrk/reports/zap-baseline.xml \
            -z "-config proxy.port=9090"

      - name: Upload ZAP Baseline Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline
          path: .zap/reports/zap-baseline.*

      - name: ZAP Authenticated Scan — Admin
        run: |
          TOKEN=$(cat .zap/tokens/admin.jwt 2>/dev/null || echo "")
          if [ -z "$TOKEN" ]; then echo "::warning::No admin token, skipping"; exit 0; fi
          mkdir -p .zap/reports
          chmod a+w .zap/reports
          docker run --rm --network host \
            -v ${{ github.workspace }}/.zap:/zap/wrk \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py \
            -t http://localhost:8080/v3/api-docs \
            -f openapi \
            -c rules.tsv \
            -r /zap/wrk/reports/zap-api-admin.html \
            -w /zap/wrk/reports/zap-api-admin.md \
            -x /zap/wrk/reports/zap-api-admin.xml \
            -z "-config proxy.port=9090 \
                -config replacer.full_list[0].description=admin_auth \
                -config replacer.full_list[0].enabled=true \
                -config replacer.full_list[0].matchtype=REQ_HEADER \
                -config replacer.full_list[0].matchstr=Authorization \
                -config replacer.full_list[0].regex=false \
                -config 'replacer.full_list[0].replacement=Bearer ${TOKEN}'"

      - name: ZAP Authenticated Scan — Operator
        run: |
          TOKEN=$(cat .zap/tokens/operator.jwt 2>/dev/null || echo "")
          if [ -z "$TOKEN" ]; then echo "::warning::No operator token, skipping"; exit 0; fi
          mkdir -p .zap/reports
          chmod a+w .zap/reports
          docker run --rm --network host \
            -v ${{ github.workspace }}/.zap:/zap/wrk \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py \
            -t http://localhost:8080/v3/api-docs \
            -f openapi \
            -c rules.tsv \
            -r /zap/wrk/reports/zap-api-operator.html \
            -w /zap/wrk/reports/zap-api-operator.md \
            -x /zap/wrk/reports/zap-api-operator.xml \
            -z "-config proxy.port=9090 \
                -config replacer.full_list[0].description=operator_auth \
                -config replacer.full_list[0].enabled=true \
                -config replacer.full_list[0].matchtype=REQ_HEADER \
                -config replacer.full_list[0].matchstr=Authorization \
                -config replacer.full_list[0].regex=false \
                -config 'replacer.full_list[0].replacement=Bearer ${TOKEN}'"

      - name: ZAP Authenticated Scan — Customer
        run: |
          TOKEN=$(cat .zap/tokens/customer.jwt 2>/dev/null || echo "")
          if [ -z "$TOKEN" ]; then echo "::warning::No customer token, skipping"; exit 0; fi
          mkdir -p .zap/reports
          chmod a+w .zap/reports
          docker run --rm --network host \
            -v ${{ github.workspace }}/.zap:/zap/wrk \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py \
            -t http://localhost:8080/v3/api-docs \
            -f openapi \
            -c rules.tsv \
            -r /zap/wrk/reports/zap-api-customer.html \
            -w /zap/wrk/reports/zap-api-customer.md \
            -x /zap/wrk/reports/zap-api-customer.xml \
            -z "-config proxy.port=9090 \
                -config replacer.full_list[0].description=customer_auth \
                -config replacer.full_list[0].enabled=true \
                -config replacer.full_list[0].matchtype=REQ_HEADER \
                -config replacer.full_list[0].matchstr=Authorization \
                -config replacer.full_list[0].regex=false \
                -config 'replacer.full_list[0].replacement=Bearer ${TOKEN}'"

      - name: Fix ZAP Report Permissions (Docker creates root-owned files)
        if: always()
        run: sudo find .zap/reports -type f -exec chmod a+r {} \; 2>/dev/null || true

      - name: Upload ZAP API Scan Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-api-auth
          path: .zap/reports/zap-api-*.*

  # ===========================================================================
  # STAGE 6 — Artifact & SBOM (nightly/manual only)
  # ===========================================================================
  artifact-scan:
    name: Artifact & SBOM Scan
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Package JAR + Generate SBOM
        run: ./mvnw -B package -DskipTests
        working-directory: vendnet
      - name: Upload SBOM (CycloneDX JSON)
        uses: actions/upload-artifact@v4
        with:
          name: sbom-nightly
          path: vendnet/target/vendnet-sbom.json
      - name: Trivy JAR Filesystem Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: 'vendnet/target/'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          format: 'sarif'
          output: 'trivy-jar-results.sarif'
      - name: Upload Trivy JAR Results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-jar-results.sarif

  # ===========================================================================
  # STAGE 7 — Deploy DEV (develop branch)
  # ===========================================================================
  deploy-dev:
    name: Deploy to DEV
    runs-on: self-hosted
    needs: docker-build
    if: github.ref == 'refs/heads/develop'
    environment:
      name: DEV
      url: http://vs427.dei.isep.ipp.pt:8280
    steps:
      - uses: actions/checkout@v4
      - name: Download Docker Image
        uses: actions/download-artifact@v4
        with:
          name: docker-image-develop
          path: /tmp/docker
      - name: Load & Deploy Docker Image
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ vars.REMOTE_HOST || 'vs427.dei.isep.ipp.pt' }}
          REMOTE_PORT: ${{ vars.REMOTE_PORT || '2222' }}
          APP_PORT: ${{ vars.APP_PORT || '8280' }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          APP_PORT=$(echo "$APP_PORT" | tr -d '[:space:]')
          REMOTE_PORT=$(echo "$REMOTE_PORT" | tr -d '[:space:]')
          ssh-keyscan -p "${REMOTE_PORT}" "${REMOTE_HOST}" >> ~/.ssh/known_hosts 2>&1 || true
          echo "Deploying to DEV at ${REMOTE_HOST}:${APP_PORT}..."
          gunzip -c /tmp/docker/vendnet-image.tar.gz | ssh -o StrictHostKeyChecking=accept-new -p "${REMOTE_PORT}" -i ~/.ssh/deploy_key root@"${REMOTE_HOST}" \
            "docker load && \
             docker stop vendnet-dev 2>/dev/null || true && \
             docker rm vendnet-dev 2>/dev/null || true && \
             docker network create vendnet-net 2>/dev/null || true && \
             docker run -d --name vendnet-dev --restart unless-stopped \
               --network vendnet-net \
               -p ${APP_PORT}:8080 \
               -e SPRING_PROFILES_ACTIVE=dev \
               -e SPRING_DATASOURCE_URL=jdbc:h2:mem:vendnet_dev;DB_CLOSE_DELAY=-1 \
               -e SPRING_DATASOURCE_DRIVER=org.h2.Driver \
               -e SPRING_JPA_HIBERNATE_DDL_AUTO=create-drop \
               -e APP_JWT_SECRET=dev-secret-key-for-ci-only \
               vendnet:develop-latest"

      - name: Smoke Test DEV
        env:
          REMOTE_HOST: ${{ vars.REMOTE_HOST || 'vs427.dei.isep.ipp.pt' }}
          APP_PORT: ${{ vars.APP_PORT || '8280' }}
        run: |
          for i in $(seq 1 30); do
            if curl -sf "http://${REMOTE_HOST}:${APP_PORT}/actuator/health" | grep -q '"status":"UP"'; then
              echo "DEV smoke test passed on port ${APP_PORT}"
              exit 0
            fi
            sleep 5
          done
          echo "::warning::DEV smoke test did not pass within 150s"

  # ===========================================================================
  # STAGE 8 — Deploy STAGING (main branch, after DAST)
  # ===========================================================================
  deploy-staging:
    name: Deploy to STAGING
    runs-on: self-hosted
    needs: [docker-build, dast]
    if: github.ref == 'refs/heads/main'
    environment:
      name: STAGING
      url: http://vs427.dei.isep.ipp.pt:8180
