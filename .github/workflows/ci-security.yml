               -e APP_JWT_SECRET='${JWT_SECRET}' \
               -e APP_PAYMENT_WEBHOOK_SECRET='${HMAC_SECRET}' \
               --security-opt no-new-privileges:true \
               --cap-drop ALL \
               --cap-add NET_BIND_SERVICE \
