# =============================================================================
# VendNet CI/CD Pipeline
#
# Clean logical flow per Doc/Sugestions.md:
#   Secret Detect ──┐
#   Semgrep ────────┤
#                   ├──> [Build, Test & Sonar] ──> [Docker Build & Trivy] ──> [DAST ZAP] ──> [Deploy]
#   SCA / Enforcer ─┘
#
# Key optimisations:
#   - Secret-detect and Semgrep run immediately (source-only, no build needed)
#   - Build+Test+ArchUnit+Integration merged into single mvn verify (no redundant runners)
#   - SonarQube reuses compiled target/ from build stage (no recompilation)
#   - Docker build removed from artifact-scan (handled by docker-build stage)
# =============================================================================

name: CI / CD Pipeline — VendNet

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: write
  pull-requests: read
  issues: write

jobs:
  # ===========================================================================
  # STAGE 0a — Secret Detection (source-only, runs immediately)
  # ===========================================================================
  secret-detect:
    name: Secret Detection - Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================================================
  # STAGE 0b — Semgrep (source-only, runs in parallel)
  # ===========================================================================
  semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep Scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/java p/secrets
      - name: Check Semgrep SARIF
        id: sarif
        run: |
          if [ -f semgrep.sarif ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; fi
      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: steps.sarif.outputs.exists == 'true'
        with:
          sarif_file: semgrep.sarif

  # ===========================================================================
  # STAGE 1 — Build, Test & Package (combined: unit + ArchUnit + integration)
  # ===========================================================================
  build:
    name: Build, Test & Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Full Build & Test (unit + ArchUnit + integration)
        run: ./mvnw -B verify -P integration-test -Dspring.profiles.active=test
        working-directory: vendnet

      - name: Upload Compiled Target (for SonarQube reuse)
        uses: actions/upload-artifact@v4
        with:
          name: compiled-target
          path: |
            vendnet/target/classes/
            vendnet/target/test-classes/
            vendnet/target/site/jacoco/
            vendnet/target/surefire-reports/
            vendnet/target/failsafe-reports/
            vendnet/pom.xml
            vendnet/sonar-project.properties

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: vendnet/target/site/jacoco/

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            vendnet/target/surefire-reports/
            vendnet/target/failsafe-reports/

  # ===========================================================================
  # STAGE 2a — SAST: SpotBugs (needs compiled classes)
  # ===========================================================================
  sast:
    name: SAST - SpotBugs + FindSecBugs
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: SpotBugs with FindSecBugs
        run: ./mvnw -B spotbugs:check -Dspotbugs.effort=Max -Dspotbugs.threshold=Low
        working-directory: vendnet
      - name: Upload SpotBugs Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spotbugs-report
          path: vendnet/target/spotbugsXml.xml

  # ===========================================================================
  # STAGE 2b — SCA: Dependency Check + Maven Enforcer
  # ===========================================================================
  sca:
    name: SCA - Dependency Check + Maven Enforcer
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Cache NVD Database
        uses: actions/cache@v4
        with:
          path: ~/.dependency-check/data
          key: nvd-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: nvd-cache-${{ runner.os }}-
      - name: Maven Enforcer (pinned versions)
        run: ./mvnw -B validate
        working-directory: vendnet
      - name: OWASP Dependency Check
        run: ./mvnw -B org.owasp:dependency-check-maven:check -Danalyzer.ossindex.enabled=false
        working-directory: vendnet
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      - name: Upload Dependency Check Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: vendnet/target/dependency-check-report.html

  # ===========================================================================
  # STAGE 2c — IAST: Runtime Taint Analysis Build Gate
  # ===========================================================================
  iast:
    name: IAST - Runtime Taint Analysis
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: IAST Taint-Tracking Build Gate
        run: ./mvnw -B verify -P iast -Dspring.profiles.active=test
        working-directory: vendnet
      - name: Upload IAST Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iast-report
          path: vendnet/target/failsafe-reports/

  # ===========================================================================
  # STAGE 3 — SonarQube Quality Gate (reuses compiled target, no recompilation)
  # ===========================================================================
  sonar:
    name: SonarQube - Quality Gate
    runs-on: ubuntu-latest
    needs: [build, sast, sca]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Download Compiled Target
        uses: actions/download-artifact@v4
        with:
          name: compiled-target
          path: vendnet/target-download

      - name: Restore target structure
        run: |
          SRC=vendnet/target-download/vendnet/target
          mkdir -p vendnet/target
          [ -d "$SRC/classes" ] && cp -r "$SRC/classes" vendnet/target/
          [ -d "$SRC/test-classes" ] && cp -r "$SRC/test-classes" vendnet/target/
          [ -d "$SRC/site" ] && cp -r "$SRC/site" vendnet/target/
          [ -d "$SRC/surefire-reports" ] && cp -r "$SRC/surefire-reports" vendnet/target/
          [ -d "$SRC/failsafe-reports" ] && cp -r "$SRC/failsafe-reports" vendnet/target/
          [ -f vendnet/target-download/vendnet/pom.xml ] && cp vendnet/target-download/vendnet/pom.xml vendnet/
          [ -f vendnet/target-download/vendnet/sonar-project.properties ] && cp vendnet/target-download/vendnet/sonar-project.properties vendnet/
          rm -rf vendnet/target-download

      - name: Import vs-gate SSL certificate
        run: |
          cp "${JAVA_HOME}/lib/security/cacerts" /tmp/cacerts
          chmod u+w /tmp/cacerts
          echo | openssl s_client -connect vs-gate.dei.isep.ipp.pt:10427 -servername vs-gate.dei.isep.ipp.pt 2>/dev/null | openssl x509 -out /tmp/vsgate.crt
          "${JAVA_HOME}/bin/keytool" -importcert -keystore /tmp/cacerts -storepass changeit -file /tmp/vsgate.crt -noprompt

      - name: SonarQube Scan + Quality Gate (no recompilation)
        run: ./mvnw -B sonar:sonar -Dsonar.host.url=https://vs-gate.dei.isep.ipp.pt:10427 -Dsonar.login=admin -Dsonar.password='@admin' -Dsonar.qualitygate.wait=true -Dsonar.qualitygate.timeout=300 -Djavax.net.ssl.trustStore=/tmp/cacerts -Djavax.net.ssl.trustStorePassword=changeit
        working-directory: vendnet

  # ===========================================================================
  # STAGE 4 — Docker Build & Trivy Scan (main/develop only)
  # ===========================================================================
  docker-build:
    name: Docker Build & Trivy Scan
    runs-on: ubuntu-latest
    needs: [build, sast, sca]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4

      - name: Extract metadata
        id: meta
        run: |
          echo "branch=${GITHUB_REF#refs/heads/}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF#refs/heads/}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build Docker Image
        run: |
          docker build -t vendnet:${{ steps.meta.outputs.tag }} vendnet/
          docker tag vendnet:${{ steps.meta.outputs.tag }} vendnet:${{ steps.meta.outputs.branch }}-latest

      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'vendnet:${{ steps.meta.outputs.tag }}'
          scan-type: 'image'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          format: 'sarif'
          output: 'trivy-image-results.sarif'

      - name: Upload Trivy Results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-image-results.sarif

      - name: Save Docker Image
        run: docker save vendnet:${{ steps.meta.outputs.tag }} | gzip > /tmp/vendnet-image.tar.gz

      - name: Upload Docker Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ steps.meta.outputs.branch }}
          path: /tmp/vendnet-image.tar.gz
          retention-days: 1

  # ===========================================================================
  # STAGE 5 — DAST: OWASP ZAP (needs build, runs on PRs too)
  # ===========================================================================
  dast:
    name: DAST - OWASP ZAP Baseline + Authenticated
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Start Spring Boot (H2 + bootstrap)
        run: |
          ./mvnw spring-boot:run -Dspring-boot.run.profiles=zap,bootstrap &
        working-directory: vendnet

      - name: Wait for App Health
        run: |
          for i in $(seq 1 30); do
            if curl -s http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "App healthy after $((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "App failed to start"
          exit 1

      - name: Obtain Admin JWT
        id: login
        run: |
          TOKEN=$(curl -s -X POST http://localhost:8080/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@vendnet.io","password":"Admin@1234"}' | \
            python3 -c "import sys,json; print(json.load(sys.stdin).get('token',''))" 2>/dev/null)
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "None" ]; then
            echo "::error::Admin login failed"
            exit 1
          fi
          echo "ADMIN_JWT=${TOKEN}" >> $GITHUB_ENV

      - name: ZAP Baseline Scan - Public Surface
        run: |
          mkdir -p .zap/reports
          chmod -R a+w .zap/reports
          docker run --rm --network host \
            -v ${{ github.workspace }}/.zap:/zap/wrk \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://localhost:8080 \
            -c rules.tsv \
            -r /zap/wrk/reports/zap-baseline.html \
            -w /zap/wrk/reports/zap-baseline.md \
            -x /zap/wrk/reports/zap-baseline.xml

      - name: Upload ZAP Baseline Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline
          path: .zap/reports/zap-baseline.*

      - name: ZAP Authenticated Scan - Protected Endpoints
        run: |
          mkdir -p .zap/reports
          chmod -R a+w .zap/reports
          docker run --rm --network host \
            -v ${{ github.workspace }}/.zap:/zap/wrk \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py \
            -t http://localhost:8080/v3/api-docs \
            -f openapi \
            -c rules.tsv \
            -r /zap/wrk/reports/zap-api-auth.html \
            -w /zap/wrk/reports/zap-api-auth.md \
            -x /zap/wrk/reports/zap-api-auth.xml \
            -z "-config replacer.full_list[0].description=admin_auth \
                -config replacer.full_list[0].enabled=true \
                -config replacer.full_list[0].matchtype=REQ_HEADER \
                -config replacer.full_list[0].matchstr=Authorization \
                -config replacer.full_list[0].regex=false \
                -config 'replacer.full_list[0].replacement=Bearer ${{ env.ADMIN_JWT }}'"

      - name: Upload ZAP API Scan Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-api-auth
          path: .zap/reports/zap-api-auth.*

  # ===========================================================================
  # STAGE 6 — Artifact & SBOM (nightly/manual only, no duplicated Docker build)
  # ===========================================================================
  artifact-scan:
    name: Artifact & SBOM Scan
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Package JAR + Generate SBOM
        run: ./mvnw -B package -DskipTests
        working-directory: vendnet
      - name: Upload SBOM (CycloneDX JSON)
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: vendnet/target/vendnet-sbom.json
      - name: Trivy JAR Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'vendnet/target/'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          format: 'sarif'
          output: 'trivy-jar-results.sarif'
      - name: Upload Trivy JAR Results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-jar-results.sarif

  # ===========================================================================
  # STAGE 7 — Deploy DEV (develop branch)
  # ===========================================================================
  deploy-dev:
    name: Deploy to DEV
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/develop'
    environment:
      name: DEV
      url: http://vs427.dei.isep.ipp.pt:2226
    steps:
      - name: Download Docker Image
        uses: actions/download-artifact@v4
        with:
          name: docker-image-develop
      - name: Deploy Acknowledged
        run: echo "DEV deployment triggered (${{ github.sha }})"

  # ===========================================================================
  # STAGE 8 — Deploy STAGING (main branch, after DAST)
  # ===========================================================================
  deploy-staging:
    name: Deploy to STAGING
    runs-on: ubuntu-latest
    needs: [docker-build, dast]
    if: github.ref == 'refs/heads/main'
    environment:
      name: STAGING
      url: http://vs427.dei.isep.ipp.pt:2226
    steps:
      - name: Download Docker Image
        uses: actions/download-artifact@v4
        with:
          name: docker-image-main
      - name: Deploy + Smoke Test
        run: echo "STAGING deployment triggered (${{ github.sha }})"

  # ===========================================================================
  # STAGE 9 — Deploy PROD (manual dispatch only)
  # ===========================================================================
  deploy-prod:
    name: Deploy to PROD
    runs-on: ubuntu-latest
    needs: [docker-build, dast, sonar]
    if: github.event_name == 'workflow_dispatch'
    environment:
      name: PROD
      url: http://vs427.dei.isep.ipp.pt:2226
    steps:
      - name: Download Docker Image
        uses: actions/download-artifact@v4
        with:
          name: docker-image-main
      - name: Deploy + Health Check
        run: echo "PROD deployment triggered (${{ github.sha }})"
